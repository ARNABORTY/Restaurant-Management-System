@if (!isLoginPage()) {
  <nav class="app-navbar" aria-label="Main navigation" (cartRequested)="openCart()"></nav>
}
<router-outlet />
@if (!isLoginPage()) {
  <footer class="app-footer"></footer>
  <aside
    class="app-cart-drawer"
    [class.is-open]="cartOpen()"
    (closeRequested)="closeCart()"
    (orderPlaced)="handleOrderPlaced($any($event))"
  ></aside>
  @if (activeInvoice(); as invoice) {
    <section class="app-invoice-modal" (closeRequested)="closeInvoice()"></section>
  }
}
